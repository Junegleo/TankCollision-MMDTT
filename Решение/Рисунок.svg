<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Times New Roman, serif" font-size="22">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#fff"/>

  <!-- ===== Левая часть: вид сверху ===== -->
  <text x="20" y="34" font-size="20" fill="#444">а) вид сверху: до и после удара</text>
  <!-- оси -->
  <line x1="40" y1="400" x2="560" y2="400" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="548" y="428">X</text>
  <line x1="320" y1="480" x2="320" y2="60" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="330" y="72">Y</text>
  <text x="296" y="426">O</text>

  <!-- снаряд m1, летит вдоль OX -->
  <g transform="translate(120,400)">
    <rect x="-22" y="-6" width="30" height="12" fill="#555"/>
    <path d="M8,-6 L22,0 L8,6 z" fill="#555"/>
  </g>
  <text x="92" y="378">m₁</text>
  <line x1="150" y1="400" x2="240" y2="400" stroke="#c62828" stroke-width="3" marker-end="url(#arR)"/>
  <text x="180" y="384" fill="#c62828">V₁</text>

  <!-- танк m2 в точке O, едет под углом α -->
  <g transform="translate(320,400) rotate(-60)">
    <rect x="-34" y="-20" width="68" height="40" rx="4" fill="#ddd" stroke="#111" stroke-width="2"/>
    <circle cx="0" cy="0" r="11" fill="#bbb" stroke="#111" stroke-width="1.5"/>
    <line x1="11" y1="0" x2="52" y2="0" stroke="#111" stroke-width="4"/>
  </g>
  <text x="352" y="440">m₂</text>
  <!-- скорость танка V2 под углом α -->
  <line x1="320" y1="400" x2="420" y2="227" stroke="#1565c0" stroke-width="3" marker-end="url(#arB)"/>
  <text x="424" y="230" fill="#1565c0">V₂</text>
  <path d="M370,400 A50,50 0 0,0 345,357" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="346" y="388">α</text>

  <!-- скорость после удара u под углом β (штрих) -->
  <line x1="320" y1="400" x2="456" y2="288" stroke="#2e7d32" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arG)"/>
  <text x="462" y="290" fill="#2e7d32">u</text>
  <path d="M410,400 A90,90 0 0,0 389,343" fill="none" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="416" y="370" fill="#2e7d32">β</text>
  <text x="40" y="500" font-size="18" fill="#444">после удара снаряд застревает, тело (m₁+m₂) движется со скоростью u</text>

  <!-- ===== Правая часть: треугольник импульсов ===== -->
  <text x="600" y="34" font-size="20" fill="#444">б) сложение импульсов</text>
  <line x1="620" y1="400" x2="860" y2="400" stroke="#111" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="846" y="426" font-size="18">X</text>
  <!-- p1 -->
  <line x1="620" y1="400" x2="730" y2="400" stroke="#c62828" stroke-width="3" marker-end="url(#arR)"/>
  <text x="640" y="430" fill="#c62828">m₁V₁</text>
  <!-- p2 от конца p1 -->
  <line x1="730" y1="400" x2="830" y2="227" stroke="#1565c0" stroke-width="3" marker-end="url(#arB)"/>
  <text x="792" y="330" fill="#1565c0">m₂V₂</text>
  <path d="M770,400 A40,40 0 0,0 750,365" fill="none" stroke="#111" stroke-width="1.2"/>
  <text x="772" y="388" font-size="18">α</text>
  <!-- p -->
  <line x1="620" y1="400" x2="828" y2="229" stroke="#2e7d32" stroke-width="3" marker-end="url(#arG)"/>
  <text x="604" y="262" fill="#2e7d32">p = (m₁+m₂)u</text>
  <path d="M680,400 A60,60 0 0,0 666,362" fill="none" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="686" y="386" font-size="18" fill="#2e7d32">β</text>
  <text x="600" y="470" font-size="18" fill="#444">p = m₁V₁ + m₂V₂ (векторно)</text>
</svg>
